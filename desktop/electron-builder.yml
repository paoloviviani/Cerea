appId: org.cerea.desktop
productName: Cerea
directories:
  output: release
  buildResources: build
# The Cerea mark on a light tile, the same artwork as the Cerea connector's Mac app
# (agent/packaging/macos/app-icon-1024.png); electron-builder makes the .icns from it.
icon: build/icon.png
files:
  - dist/**
  - package.json
# galopin (one binary per platform, built from agent/ at the same commit) and the browser runtime.
extraResources:
  - from: resources/galopin
    to: galopin
  # Node.js (pinned, checksum-verified at build time), so browser use needs nothing installed.
  - from: resources/node
    to: node
  # The browser runtime the app runs itself for the chat in its window (ADR 0122), with its
  # node_modules/playwright-core. Copied from resources/ with a filter, not `from:
  # resources/browser-runtime`: electron-builder (app-builder-lib 26, util/filter.js) always drops a
  # node_modules directly under an entry's `from`, whatever the filter, and v0.67.0 shipped without
  # it. scripts/check-packaged.mjs checks the package in CI.
  - from: resources
    to: .
    filter: ["browser-runtime/**/*"]
asar: true
mac:
  category: public.app-category.productivity
  target: [zip]
  # Unsigned for now, as the Cerea connector app is; see docs/dev/desktop-app.md.
  identity: null
linux:
  category: Utility
  target: [AppImage, deb]
  maintainer: Cerea <noreply@github.com>
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
