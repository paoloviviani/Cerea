# Build the Cerea image on every PR; publish it from main, deploy/rearch (to
# exercise the pipeline) and release tags.
#
# The package is PRIVATE while the repository is: images pushed with
# GITHUB_TOKEN from a private repository inherit its visibility, and pulling
# needs `docker login ghcr.io` with a read:packages token. Going public later
# is the package's own setting (Package settings → Danger Zone → Change
# visibility).
#
# Private storage counts against the Packages quota, so the tag set is lean:
#   main → edge;  deploy/rearch → rearch;  vX.Y.Z → X.Y.Z, X.Y (never overwritten)
# Pystino pins this image by digest in deploy/stack/release.env (ADR 0087), so
# no per-commit tag is needed; the cleanup job keeps the newest five untagged
# versions and deletes the rest. Attestations are off: they are stored as
# untagged manifests, and pruning those would break the image.
#
# Built with APP_BASE=/chat: SvelteKit's base path is compile-time, and /chat
# is where every stack serves the chat.
name: images

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "installer/**"
  push:
    branches: [main, deploy/rearch]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  cerea:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/cerea:${GITHUB_REF_NAME#v}" >/dev/null 2>&1; then
            echo "::error::cerea:${GITHUB_REF_NAME#v} already exists; a release tag is immutable"; exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerea
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=rearch,enable=${{ github.ref == 'refs/heads/deploy/rearch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=cerea
            org.opencontainers.image.licenses=Apache-2.0

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            APP_BASE=/chat
            PUBLIC_COMMIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=cerea
          cache-to: type=gha,mode=max,scope=cerea
          provenance: false
          sbom: false

      - name: Record the digest (what Pystino's release.env pins)
        if: env.PUBLISH == 'true'
        run: echo "CEREA_IMAGE=ghcr.io/${{ github.repository_owner }}/cerea@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: cerea
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: cerea
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 5
