# The bundled Authelia's configuration, read by the stock Authelia image from
# this directory (mounted read-only at /etc/authelia).
#
# Rendered by Authelia itself at start (template filter), never by a script on
# the host. Values come from the template functions `env` (the container
# environment, compose.yaml <- .env, variables named X_PYSTINO_*) and `secret`
# (files the bootstrap service creates once under /config/keys).
#
# NEVER write a double-brace template expression in a comment in this file:
# the filter executes the whole file, comments included, and Authelia then
# refuses to start.
#
# Nothing here is state; the users file and the signing key are, and live in
# the authelia-config volume. Client *secrets* appear only as digests
# (./configure mints each secret and its digest together; see .env.example
# for the command that does it by hand). Plaintext client secrets are
# deprecated in 4.39 and slated for removal.
#
# Changed this file? compose does not notice a mounted file: run
# `docker compose up -d --force-recreate authelia`, or tools/pin to refresh
# the config-rev label in compose.yaml.

server:
  address: 'tcp://:9091/authelia'

log:
  level: 'info'
  format: 'text'

authentication_backend:
  password_reset:
    # Self-service reset needs SMTP; without it, an administrator issues
    # one-time passwords from the console instead.
    disable: {{ if env "X_PYSTINO_SMTP_HOST" }}false{{ else }}true{{ end }}
  file:
    path: '/config/users_database.yml'
    watch: true
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# No second factor: the bundled Authelia is a local-accounts door, not an
# MFA provider. A deployment that needs MFA runs an external IdP instead.
# Stated outright, not just implied by every client's own `one_factor`
# policy below, so it stays true even if a later edit adds one back there.
totp:
  disable: true
webauthn:
  disable: true
# duo_api intentionally absent: Duo is unconfigured, not merely unused.

access_control:
  default_policy: 'one_factor'

session:
  name: 'authelia_session'
  secret: '{{ env "X_PYSTINO_SESSION_SECRET" }}'
  expiration: '1h'
  inactivity: '5m'
  cookies:
    - name: 'authelia_session'
      domain: '{{ env "X_PYSTINO_COOKIE_DOMAIN" }}'
      authelia_url: '{{ env "X_PYSTINO_PUBLIC_ORIGIN" }}/authelia'
      same_site: 'lax'
      expiration: '1h'
      inactivity: '5m'

storage:
  local:
    path: '/data/db.sqlite3'
  # Encrypts the sqlite store, which holds the opaque subject identifiers every
  # user is keyed on downstream. Changing it re-keys everyone: never rotate it.
  encryption_key: '{{ env "X_PYSTINO_STORAGE_KEY" }}'

# Signs the reset-password link's token. Required once self-service reset is
# on; set regardless, so turning on SMTP later never needs a fresh secret.
identity_validation:
  reset_password:
    jwt_secret: {{ env "X_PYSTINO_RESET_PASSWORD_JWT_SECRET" | msquote }}

notifier:
{{ if env "X_PYSTINO_SMTP_HOST" }}
{{ $scheme := "submission" }}
{{ if eq (env "X_PYSTINO_SMTP_SECURITY") "tls" }}{{ $scheme = "submissions" }}{{ else if eq (env "X_PYSTINO_SMTP_SECURITY") "none" }}{{ $scheme = "smtp" }}{{ end }}
  smtp:
    address: {{ printf "%s://%s:%s" $scheme (env "X_PYSTINO_SMTP_HOST") (env "X_PYSTINO_SMTP_PORT") | msquote }}
    username: {{ env "X_PYSTINO_SMTP_USERNAME" | msquote }}
    sender: {{ env "X_PYSTINO_SMTP_FROM" | msquote }}
    # A mail sink with no certificate at all needs this; a real server's own
    # STARTTLS is otherwise required no matter which scheme above is picked.
    disable_starttls: {{ if eq (env "X_PYSTINO_SMTP_SECURITY") "none" }}true{{ else }}false{{ end }}
    # An unauthenticated relay on a private network needs no password: this
    # line is then absent rather than pointing at a file that was never
    # written, so it does not stop Authelia starting.
    {{ if env "X_PYSTINO_SMTP_HAS_PASSWORD" }}
    password: {{ secret "/config/keys/smtp_password" | msquote }}
    {{ end }}
{{ else }}
  filesystem:
    filename: '/data/notification.txt'
{{ end }}

identity_providers:
  oidc:
    hmac_secret: '{{ env "X_PYSTINO_HMAC_SECRET" }}'
    jwks:
      - key_id: 'pystino'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/config/keys/jwks.pem" | mindent 10 "|" | msquote }}
    claims_policies:
      pystino:
        id_token: ['groups', 'email', 'email_verified', 'preferred_username', 'name']
        access_token: ['groups', 'email', 'email_verified', 'preferred_username', 'name']
    lifespans:
      custom:
        agent_machine:
          access_token: '1h'
          refresh_token: '90d'
    clients:
      - client_id: 'pystino-console'
        client_name: 'Pystino Console'
        client_secret: '{{ env "X_PYSTINO_CONSOLE_CLIENT_DIGEST" }}'
        public: false
        authorization_policy: 'one_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - '{{ env "X_PYSTINO_PUBLIC_ORIGIN" }}/auth/callback/default'
          - '{{ env "X_PYSTINO_PUBLIC_ORIGIN" }}/auth/callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'RS256'
        token_endpoint_auth_method: 'client_secret_post'
        audience: ['pystino-api']
        requested_audience_mode: 'implicit'
        claims_policy: 'pystino'
        # First-party: auto-approved, no consent screen.
        consent_mode: 'implicit'
      - client_id: 'cerea'
        client_name: 'Cerea Chat'
        client_secret: '{{ env "X_PYSTINO_CHAT_CLIENT_DIGEST" }}'
        public: false
        authorization_policy: 'one_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - '{{ env "X_PYSTINO_PUBLIC_ORIGIN" }}/chat/login/callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: 'RS256'
        token_endpoint_auth_method: 'client_secret_basic'
        audience: ['pystino-api']
        requested_audience_mode: 'implicit'
        claims_policy: 'pystino'
        # First-party: auto-approved, no consent screen.
        consent_mode: 'implicit'
      # galopin's public client (agent machines). Kept under this id so
      # machines enrolled before the move keep refreshing.
      - client_id: 'opencode-enrollment'
        client_name: 'Opencode Enrollment'
        public: true
        authorization_policy: 'one_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'http://127.0.0.1/callback'
          - 'http://localhost/callback'
        scopes: ['openid', 'profile', 'email', 'groups', 'offline_access']
        response_types: ['code']
        grant_types: ['authorization_code', 'urn:ietf:params:oauth:grant-type:device_code', 'refresh_token']
        access_token_signed_response_alg: 'RS256'
        token_endpoint_auth_method: 'none'
        audience: ['pystino-api']
        requested_audience_mode: 'implicit'
        claims_policy: 'pystino'
        consent_mode: 'pre-configured'
        lifespan: 'agent_machine'
