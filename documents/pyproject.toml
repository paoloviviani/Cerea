[project]
name = "cerea-documents"
version = "0.1.0"
description = "Cerea document service: precise, hardened edits of Word, Excel and PowerPoint files (ADR 0103)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "starlette>=0.46",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "jsonschema>=4.23",
    "lxml>=5.3",
    "pillow>=11.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "reportlab>=4.2",
    "pypdf>=5",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "lxml-stubs>=0.5",
    "types-jsonschema",
    "types-openpyxl",
    "types-pillow",
    "pip-licenses>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerea_documents"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "E501", "RUF012", "UP031", "RUF043", "SIM105", "SIM117"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pptx", "pptx.*", "reportlab", "reportlab.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the builders drive python-docx, python-pptx and reportlab, whose own types are missing or partial
module = ["cerea_documents.make_docx", "cerea_documents.make_pptx", "cerea_documents.make_pdf", "cerea_documents.charts"]
disallow_untyped_calls = false
disallow_subclassing_any = false
disable_error_code = ["attr-defined", "arg-type", "union-attr", "unused-ignore", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"

[[tool.mypy.overrides]]
# test code drives untyped third-party builders (python-docx, python-pptx); keep strictness elsewhere
module = ["tests.*"]
disable_error_code = ["union-attr", "index", "attr-defined", "dict-item", "arg-type"]
disallow_untyped_calls = false
warn_return_any = false
warn_unused_ignores = false
