# "Cerea connector", the galopin menu-bar app for macOS (agent/cmd/galopin-tray,
# agent/packaging/macos). cgo is needed for the tray, so it is built on macOS.
# Two zips, one per architecture (arm64 and amd64), each with its own Node 22 LTS.
# No notarization (no Apple account): the bundle is signed ad hoc, and the
# installer / first-open steps are in docs/agent-machines.md.
#
# Runs on demand, on a pull request or push to main that touches the app, and on
# a v* tag, which also attaches the zips and the installer to that release.
name: macos-app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/cmd/galopin-tray/**"
      - "agent/internal/trayapp/**"
      - "agent/internal/appstatus/**"
      - "agent/packaging/macos/**"
      - ".github/workflows/macos-app.yml"
  push:
    branches: [main]
    paths:
      - "agent/cmd/galopin-tray/**"
      - "agent/internal/trayapp/**"
      - "agent/internal/appstatus/**"
      - "agent/packaging/macos/**"
      - ".github/workflows/macos-app.yml"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Go tests (the parts that need no Mac)
        working-directory: agent
        run: go test -p 2 ./internal/trayapp ./internal/appstatus ./internal/link
      - name: Installer and bundle script
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          cd agent/packaging/macos
          bash -n install.sh build-app.sh install_test.sh
          shellcheck -s sh install.sh build-app.sh
          bash install_test.sh

  build:
    needs: check
    runs-on: macos-latest # Apple Silicon; the amd64 build is cross-compiled
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, clang: arm64, node: arm64 }
          - { arch: amd64, clang: x86_64, node: x64 }
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Node 22 LTS (official tarball, checked against Node's SHASUMS256)
        run: |
          set -euo pipefail
          base=https://nodejs.org/dist/latest-v22.x
          curl -fsSL "$base/SHASUMS256.txt" -o SHASUMS256.txt
          line=$(grep -E "  node-v22\.[0-9]+\.[0-9]+-darwin-${{ matrix.node }}\.tar\.gz$" SHASUMS256.txt)
          [ "$(echo "$line" | wc -l)" = 1 ] || { echo "no single Node 22 tarball found"; exit 1; }
          file=${line##* }
          curl -fsSL "$base/$file" -o "$file"
          echo "$line" | shasum -a 256 -c -
          mkdir node-dir && tar -xzf "$file" -C node-dir --strip-components=1
          node-dir/bin/node --version | grep -E '^v22\.' || true
          echo "node-dir/bin/node $(file node-dir/bin/node)"

      - name: galopin CLI (no cgo)
        working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/galopin" .

      - name: Tray (cgo)
        working-directory: agent
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CC: clang -arch ${{ matrix.clang }}
          CGO_CFLAGS: -mmacosx-version-min=12.0
          CGO_LDFLAGS: -mmacosx-version-min=12.0
        run: go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/galopin-tray" ./cmd/galopin-tray

      - name: Check the architectures
        run: |
          for f in "$RUNNER_TEMP/galopin" "$RUNNER_TEMP/galopin-tray" node-dir/bin/node; do
            lipo -info "$f"
            lipo -info "$f" | grep -q "${{ matrix.clang }}" || { echo "wrong architecture: $f"; exit 1; }
          done

      - name: Icon
        run: |
          set -e
          src=agent/packaging/macos/app-icon-1024.png
          iconset="$RUNNER_TEMP/icon.iconset"; mkdir "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) "$src" --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$RUNNER_TEMP/icon.icns"

      - name: Assemble, sign ad hoc and zip
        run: |
          sh agent/packaging/macos/build-app.sh --arch ${{ matrix.arch }} --version "${{ steps.v.outputs.version }}" \
            --tray "$RUNNER_TEMP/galopin-tray" --cli "$RUNNER_TEMP/galopin" --node-dir node-dir \
            --icns "$RUNNER_TEMP/icon.icns" --out dist
          codesign --verify --deep --strict "dist/Cerea connector.app"
          codesign -dv "dist/Cerea connector.app" 2>&1 | grep -E 'Signature|Identifier'

      - name: Smoke test (Apple Silicon build runs on this runner)
        if: matrix.arch == 'arm64'
        run: |
          app="dist/Cerea connector.app/Contents"
          "$app/Resources/galopin" licenses | head -3
          "$app/Resources/node/bin/node" --version
          "$app/Resources/node/bin/npm" --version

      - uses: actions/upload-artifact@v4
        with:
          name: cerea-connector-macos-${{ matrix.arch }}
          path: |
            dist/Cerea-connector-macos-${{ matrix.arch }}.zip
            dist/Cerea-connector-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cerea-connector-macos-*
          merge-multiple: true
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp agent/packaging/macos/install.sh dist/install-cerea-connector.sh
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
