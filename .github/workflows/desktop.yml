# The Cerea desktop app (Electron, desktop/). Builds a Linux AppImage and deb and an unsigned
# macOS zip (arm64 and x64) on pushes and pull requests that touch the app. It publishes nothing itself:
# the artifacts are attached to the run (kept 90 days, the maximum) and scripts/release/desktop-assets.sh
# attaches them to each Cerea release. See docs/dev/desktop-app.md.
name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "browser-runtime/**"
      - "agent/*.go"
      - "agent/internal/**"
      # The Cerea version the app and its galopin are stamped with (scripts/cerea-version.mjs).
      - "package.json"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main, feat/desktop-app]
    paths:
      - "desktop/**"
      - "browser-runtime/**"
      - "agent/*.go"
      - "agent/internal/**"
      - "package.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            browser-runtime/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: npm ci
      - run: npm ci
        working-directory: browser-runtime
      - name: Format and types
        run: npm run lint
      - name: Build galopin for this runner
        run: npm run galopin:build
      - name: Unit tests
        run: npm test
      - name: Build the app
        run: npm run build
      - name: Smoke test under Xvfb (three parts load; the runtime drives the panel; idle CPU)
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 >/dev/null
          SMOKE_IDLE_SECONDS=20 xvfb-run -a node scripts/smoke.mjs
          xvfb-run -a node scripts/smoke2.mjs

  linux:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: npm ci
      - run: npm run galopin:build
      - run: node scripts/fetch-node.mjs linux x64
      - run: npm run build
      - run: npm run runtime:stage
      # The app's version is the Cerea version (scripts/package.mjs), as galopin's (galopin:build).
      - run: npm run package -- --linux AppImage deb
      # What v0.67.0 lacked: playwright-core beside the runtime, run with the packaged Node.
      - name: Check the package (runtime, playwright-core, versions)
        run: |
          set -eu
          node scripts/check-packaged.mjs release/linux-unpacked/resources
          V=$(node -p "require('../package.json').version")
          for f in browser-runtime/cerea-browser.mjs browser-runtime/node_modules/playwright-core/package.json; do
            dpkg-deb -c "release/cerea-desktop_${V}_amd64.deb" | grep "/opt/Cerea/resources/$f\$" >/dev/null ||
              { echo "the deb lacks resources/$f"; exit 1; }
          done
          x=$(mktemp -d)
          (cd "$x" && "$GITHUB_WORKSPACE/desktop/release/Cerea-$V.AppImage" --appimage-extract 'resources/browser-runtime/*' >/dev/null)
          test -f "$x/squashfs-root/resources/browser-runtime/cerea-browser.mjs"
          test -f "$x/squashfs-root/resources/browser-runtime/node_modules/playwright-core/package.json"
          echo "deb and AppImage carry the runtime and playwright-core ($V)"
      - uses: actions/upload-artifact@v4
        with:
          name: cerea-desktop-linux
          retention-days: 90
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  macos:
    needs: check
    runs-on: macos-latest # Apple Silicon; the x64 zip is built on it too
    strategy:
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: npm ci
      - name: Build galopin for the target architecture
        run: npm run galopin:build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
      - run: node scripts/fetch-node.mjs darwin ${{ matrix.arch }}
      - run: npm run build
      - run: npm run runtime:stage
      # Unsigned and not notarised, like the Cerea connector app: no Apple account yet.
      - run: npm run package -- --mac zip --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The x64 app runs here under Rosetta: its Node and galopin are run, not only listed.
      - name: Check the package (runtime, playwright-core, versions)
        run: |
          set -eu
          node scripts/check-packaged.mjs "release/${{ matrix.arch == 'x64' && 'mac' || 'mac-arm64' }}/Cerea.app/Contents/Resources"
          zip=$(ls release/*.zip)
          for f in browser-runtime/cerea-browser.mjs browser-runtime/node_modules/playwright-core/package.json; do
            unzip -l "$zip" | grep "Cerea.app/Contents/Resources/$f\$" >/dev/null || { echo "$zip lacks Resources/$f"; exit 1; }
          done
          echo "$zip carries the runtime and playwright-core"
      - uses: actions/upload-artifact@v4
        with:
          name: cerea-desktop-macos-${{ matrix.arch }}
          retention-days: 90
          path: desktop/release/*.zip
