# Publish the documentation site to GitHub Pages.
#
# Runs on pushes to main that touch the docs, the site config, or the deploy
# kit's README (the deploy-kit page includes kit/README.md from this
# repository), and on demand.
# The build is `--strict`: a broken link or a missing include fails the
# publish rather than shipping a lying page.
#
# Sized for the GitHub free plan (see ci.yml's header): one job, no matrix,
# a plain `mkdocs build` into `public/` (no mkdocs gh-deploy, which would
# push a branch we do not want), published with actions/upload-pages-artifact
# + deploy-pages.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      # The kit's own README rides along: deploy-kit.md includes it.
      - "kit/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub Pages deploys from the default branch only.
    if: github.ref == 'refs/heads/main'
    # A job-level block replaces the workflow's, so contents: read is repeated
    # here: without it the token cannot read this (private) repository and
    # checkout answers "repository not found".
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # astral-sh/setup-uv installs uv; the pinned set lives in
      # docs/requirements.txt with no Python project file in the repo.
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with-requirements docs/requirements.txt mkdocs build --strict --site-dir public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
