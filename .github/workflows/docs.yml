# Publish the documentation site to GitHub Pages.
#
# Runs on pushes to main that touch the docs, the site config, or the deploy
# kit's README (the deploy-kit page includes the sibling cerea-deploy checkout
# at build time — fetched here read-only, never committed), and on demand.
# The build is `--strict`: a broken link or a missing include fails the
# publish rather than shipping a lying page.
#
# Sized for the GitHub free plan (see ci.yml's header): one job, no matrix,
# a plain `mkdocs build` into `public/` (no mkdocs gh-deploy, which would
# push a branch we do not want), published with actions/upload-pages-artifact
# + deploy-pages.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      # The kit's own README rides along: deploy-kit.md includes it.
      # (The cerea-deploy push itself does not trigger this workflow; a
      # Cerea docs push after a kit README change re-publishes. For an
      # immediate republish on a kit-only change, run this manually.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub Pages deploys from the default branch only.
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The deploy-kit page's --8<-- "cerea-deploy/README.md" include:
      # the sibling repo checked out next to this one, exactly where the
      # snippets base_path ([".", ".."]) expects it. check_paths:true makes
      # the strict build fail if this ever goes missing, so the page can
      # not silently render stale.
      - uses: actions/checkout@v4
        with:
          repository: paoloviviani/cerea-deploy
          path: cerea-deploy

      # astral-sh/setup-uv installs uv; the pinned set lives in
      # docs/requirements.txt with no Python project file in the repo.
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with-requirements docs/requirements.txt mkdocs build --strict --site-dir public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
