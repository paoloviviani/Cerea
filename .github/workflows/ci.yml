# The one PR workflow for Cerea (it folds in the checks thin-agent/main parked
# here as ci.yml: check, lint, vitest), plus galopin's own Go checks now that
# it lives here as agent/.
#
# Sized for the GitHub free plan's Action minutes:
#   - PRs and manual runs only, docs excluded, no matrix, cancel-in-progress;
#   - ONE job for lint + check + the server/ssr suite, so `npm ci` (the
#     slowest step) is paid once per run instead of once per job;
#   - a second, independent job for gofmt/vet/test in agent/, since it needs
#     no Node and would otherwise wait behind npm ci for nothing;
#   - the client project (a real Chromium in the Playwright image, the
#     costliest suite) runs on pushes to main, weekly and on demand, and on a
#     PR only when it touches src/lib/components (job `changes` decides);
#   - the end-to-end suite (tests/, Playwright against a real build, its own
#     Mongo and a mock LLM upstream): a tagged smoke subset (@smoke in the
#     title, ~15 specs, a few minutes) on every push to main and every PR, and
#     the whole suite nightly and on demand (`gh workflow run ci.yml --ref
#     <branch> -f full=true`). Every spec in either set must pass: nothing is
#     skipped or retried into green.
# Image builds are images.yml (main and tags); the gateway contract is
# contract.yml; galopin's real-opencode suite, on the pinned opencode and on its
# newest release, is opencode.yml.
name: ci

on:
  # Every push to main too: merges skip the commit hook's formatting and
  # nothing else tested main between releases.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      # The deploy kit has its own workflow, kit.yml.
      - "kit/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      # The deploy kit has its own workflow, kit.yml.
      - "kit/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the whole end-to-end suite (about 40 minutes)"
        type: boolean
        default: false
  schedule:
    - cron: "41 4 * * 1" # Mondays: the client project
    - cron: "17 3 * * *" # nightly: the whole end-to-end suite

permissions:
  contents: read

concurrency:
  # The nightly and a dispatched full run get their own groups, so a push to
  # main does not cancel a 40-minute run that is not about that push.
  group: ci-${{ github.ref }}-${{ github.event.schedule || (inputs.full && 'full') || 'main' }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        # mongo:8 (8.0.x) refuses to boot on Linux kernel 6.19+ (SERVER-121912,
        # the tcmalloc rseq bug), and since the 20261018.339 runner images both
        # ubuntu-latest (Ubuntu 26) and ubuntu-24.04 carry such a kernel — a
        # pin to 24.04 passed at first, then failed the same way, so no runner
        # image avoids it any more. The 8.2 series boots where 8.0 and the
        # 8.3/9.0 lines refuse (SERVER-136272: "on 9.0.x and 8.3.x but not
        # 8.2"), so the service pins to it until 8.0 ships the fixed tcmalloc.
        image: mongo:8.2
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' localhost:27017/test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # mongodb-memory-server needs AVX, which hosted runners do not reliably
      # have; the suite uses the service container instead (see AGENTS.md).
      TEST_MONGODB_URL: mongodb://127.0.0.1:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # One shared Mongo, no per-file isolation: the files run serially.
      # pyodide.worker.integration.spec.ts skips here: it needs the ~325 MB
      # vendored Pyodide dist (not fetched, to keep PR runs short) and is a
      # known pre-existing failure even with it — tracked in
      # reports/2026-09-24-thin-agent-progress.md ("Known CI exclusions").
      - run: npx vitest run --project=server --project=ssr --no-file-parallelism

  go:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # The document service (ADR 0103), documents/: lint, strict types, tests (including the
  # hostile-fixture suite and the time-limit kill), then the image is built (no push), held to
  # its size budget and smoke-run with the hardened container settings the kit will use.
  documents:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # LibreOffice behind Gotenberg: a generated deck must convert (the render check below)
    services:
      gotenberg:
        image: gotenberg/gotenberg:8.38.1
        ports:
          - 3000:3000
    defaults:
      run:
        working-directory: documents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: documents/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Render check (LibreOffice via Gotenberg)
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
          GOTENBERG_URL=http://127.0.0.1:3000 uv run pytest -q tests/test_pptx_layout.py -k converts
      - name: Build the image (no push)
        run: docker build -t cerea-documents:ci .
      - name: Image stays under 300 MB
        run: |
          size="$(docker image inspect cerea-documents:ci --format '{{.Size}}')"
          echo "image size: $size bytes"
          test "$size" -lt 314572800
      - name: Smoke-run the hardened image
        run: |
          docker run -d --name docs --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1 \
            -e CEREA_DOCUMENTS_SECRET=ci-secret -p 8090:8090 cerea-documents:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/v1/capabilities)" = 401
          curl -fsS -H 'X-Cerea-Documents-Secret: ci-secret' http://127.0.0.1:8090/v1/capabilities | grep -q '"docx"'
          # a real document through the worker subprocess in the locked-down container
          uv run python -c "import docx; docx.Document().save('/tmp/ci.docx')"
          curl -fsS -H 'X-Cerea-Documents-Secret: ci-secret' -F file=@/tmp/ci.docx http://127.0.0.1:8090/v1/outline | grep -q '"format":"docx"'
          # creation in the locked-down container: a native chart (python-pptx part) and an image chart (matplotlib)
          cat > /tmp/create.json <<'JSON'
          {"format":"docx","spec":{"blocks":[{"type":"heading","level":1,"text":"CI"},{"type":"chart","chart_type":"column","categories":["a","b"],"series":[{"name":"s","values":[1,2]}]},{"type":"chart","chart_type":"pie","render":"image","categories":["a","b"],"series":[{"name":"s","values":[1,2]}]}]}}
          JSON
          curl -fsS -H 'X-Cerea-Documents-Secret: ci-secret' -H 'Accept: application/json' -F 'body=</tmp/create.json' http://127.0.0.1:8090/v1/create | grep -q '"reopened_with":"python-docx"'
      - name: Container logs on failure
        if: failure()
        run: docker logs docs || true

  # Whether the client project should run: always, except on a PR that leaves
  # src/lib/components alone (a component change is what the project tests).
  changes:
    if: github.event.schedule != '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.diff.outputs.client }}
      documents: ${{ steps.diff.outputs.documents }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            echo "documents=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          if grep -q '^src/lib/components/' <<<"$changed"; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi
          # the document service: only when it (or this workflow, or the skill copy of its PDF form code) changed
          if grep -qE '^(documents/|\.github/workflows/ci\.yml$|scripts/sync_pdf_tools\.py$|src/lib/server/skills/builtin/pdf-tools/)' <<<"$changed"; then
            echo "documents=true" >> "$GITHUB_OUTPUT"
          else
            echo "documents=false" >> "$GITHUB_OUTPUT"
          fi

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The Playwright image's browsers must match the *installed* Playwright
    # exactly, or the project silently reports "no tests" (see AGENTS.md).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user root
    env:
      HOME: /root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx vitest run --project=client

  # The end-to-end smoke subset: the specs tagged @smoke (sign-in-free landing,
  # a chat turn against the mock upstream, sidebar and projects, workspace
  # tabs, settings, the /code panel's basics, file cards). Builds once, then
  # the harness (playwright.config.ts) starts its own Mongo, mock upstream,
  # mock IdP and the app from that build: no service container needed.
  e2e-smoke:
    if: github.event.schedule == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user root
    env:
      HOME: /root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      # mongodb-memory-server's mongod links libcurl.
      - run: apt-get update -qq && (apt-get install -y -qq libcurl4t64 || apt-get install -y -qq libcurl4)
      # The checkout is owned by another uid than root: without this git (and so go build's VCS
      # stamping of galopin) refuses it as a "dubious ownership" repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: /root/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npx playwright test --project=chromium --grep @smoke
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The whole end-to-end suite, chromium: nightly, and on demand with
  # `-f full=true`. The real-machine specs run a real galopin (built from
  # agent/) over a real opencode, so this job carries Go and opencode too.
  e2e-full:
    if: github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user root
    env:
      HOME: /root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: apt-get update -qq && (apt-get install -y -qq libcurl4t64 || apt-get install -y -qq libcurl4)
      # The checkout is owned by another uid than root: without this git (and so go build's VCS
      # stamping of galopin) refuses it as a "dubious ownership" repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: /root/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - name: Install the pinned opencode
        run: |
          want=$(cat agent/packaging/opencode-version)
          npm install -g "opencode-ai@${want}"
          [ "$(opencode --version)" = "$want" ] || { echo "::error::wrong opencode"; exit 1; }
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npx playwright test --project=chromium
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-full-report
          path: |
            playwright-report
            test-results
          retention-days: 7
