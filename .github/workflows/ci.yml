# The one PR workflow for Cerea (it folds in the checks thin-agent/main parked
# here as ci.yml: check, lint, vitest), plus galopin's own Go checks now that
# it lives here as agent/.
#
# Sized for the GitHub free plan's Action minutes:
#   - PRs and manual runs only, docs excluded, no matrix, cancel-in-progress;
#   - ONE job for lint + check + the server/ssr suite, so `npm ci` (the
#     slowest step) is paid once per run instead of once per job;
#   - a second, independent job for gofmt/vet/test in agent/, since it needs
#     no Node and would otherwise wait behind npm ci for nothing;
#   - the client project (a real Chromium in the Playwright image, the
#     costliest suite) runs on pushes to main, weekly and on demand, and on a
#     PR only when it touches src/lib/components or a route component (job `changes` decides);
#   - the end-to-end suite (tests/, Playwright against a real build, its own
#     Mongo and a mock LLM upstream): a tagged smoke subset (@smoke in the
#     title, ~15 specs, a few minutes) on every push to main and every PR, and
#     the whole suite nightly, on demand (`gh workflow run ci.yml --ref
#     <branch> -f full=true`) and on a PR that touches what the suite runs
#     against (job `changes`, output `e2e`). The whole suite is 4 shards (job
#     `e2e-shard`, merged into one report by the aggregate job `e2e-full`).
#     Every spec in either set must pass: nothing is skipped or retried into
#     green.
# Image builds are images.yml (main and tags); the gateway contract is
# contract.yml; galopin's real-opencode suite, on the pinned opencode and on its
# newest release, is opencode.yml.
name: ci

on:
  # Every push to main too: merges skip the commit hook's formatting and
  # nothing else tested main between releases.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      # The deploy kit has its own workflow, kit.yml.
      - "kit/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      # The deploy kit has its own workflow, kit.yml.
      - "kit/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the whole end-to-end suite (about 40 minutes)"
        type: boolean
        default: false
  schedule:
    - cron: "41 4 * * 1" # Mondays: the client project
    - cron: "17 3 * * *" # nightly: the whole end-to-end suite

permissions:
  contents: read

concurrency:
  # The nightly and a dispatched full run get their own groups, so a push to
  # main does not cancel a 40-minute run that is not about that push.
  group: ci-${{ github.ref }}-${{ github.event.schedule || (inputs.full && 'full') || 'main' }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.2" # >= 24.22.1: CVE-2026-111497 (Brotli); 24.22.2: V8 backports (CI crash "jit_page.has_value()", exit 133)

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        # mongo:8 (8.0.x) refuses to boot on Linux kernel 6.19+ (SERVER-121912,
        # the tcmalloc rseq bug), and since the 20261018.339 runner images both
        # ubuntu-latest (Ubuntu 26) and ubuntu-24.04 carry such a kernel — a
        # pin to 24.04 passed at first, then failed the same way, so no runner
        # image avoids it any more. The 8.2 series boots where 8.0 and the
        # 8.3/9.0 lines refuse (SERVER-136272: "on 9.0.x and 8.3.x but not
        # 8.2"), so the service pins to it until 8.0 ships the fixed tcmalloc.
        image: mongo:8.2
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' localhost:27017/test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # A real S3-compatible server (RustFS, the kit's bundled store) for the
      # blob-store contract and migration specs, and for a run of the specs
      # that touch files with CHAT_BLOB_STORE=s3. Not a mock: the point is the
      # real multipart, range and error behaviour.
      rustfs:
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key-0123456789
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # mongodb-memory-server needs AVX, which hosted runners do not reliably
      # have; the suite uses the service container instead (see AGENTS.md).
      TEST_MONGODB_URL: mongodb://127.0.0.1:27017/
      # Turns on the S3 halves of src/lib/server/blobs/*.spec.ts.
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: ci-access-key
      TEST_S3_SECRET_KEY: ci-secret-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # One shared Mongo, no per-file isolation: the files run serially.
      # pyodide.worker.integration.spec.ts skips here: it needs the ~325 MB
      # vendored Pyodide dist (not fetched, to keep PR runs short) and is a
      # known pre-existing failure even with it — tracked in
      # reports/2026-09-24-thin-agent-progress.md ("Known CI exclusions").
      # Retries ONLY a V8 fatal at start-up (exit 133, SIGTRAP: "Check failed:
      # jit_page.has_value()", backlog C68), never a test failure (exit 1).
      - run: |
          for attempt in 1 2 3; do
            npx vitest run --project=server --project=ssr --no-file-parallelism && exit 0
            rc=$?
            [ "$rc" -eq 133 ] || exit "$rc"
            echo "::warning::vitest died with a V8 fatal (exit 133), retrying ($attempt/3)"
          done
          exit 133
      # The specs that store, read or delete files, again on the S3 backend.
      - name: File specs on S3 (RustFS)
        env:
          CHAT_BLOB_STORE: s3
          CHAT_S3_ENDPOINT: http://127.0.0.1:9000
          CHAT_S3_BUCKET: cerea-ci
          CHAT_S3_ACCESS_KEY_ID: ci-access-key
          CHAT_S3_SECRET_ACCESS_KEY: ci-secret-key-0123456789
          CHAT_S3_CREATE_BUCKET: "true"
        run: |
          files="$(grep -rlE 'blobs/testing|blobStore' src --include='*.spec.ts' | grep -v 'src/lib/server/blobs/' | sort)"
          for attempt in 1 2 3; do
            npx vitest run --project=server --project=ssr --no-file-parallelism $files && exit 0
            rc=$?
            [ "$rc" -eq 133 ] || exit "$rc"
            echo "::warning::vitest died with a V8 fatal (exit 133), retrying ($attempt/3)"
          done
          exit 133

  go:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v "^third_party/")"
      - run: go vet ./...
      - run: go test ./...

  # The document service (ADR 0103), documents/: lint, strict types, tests (including the
  # hostile-fixture suite and the time-limit kill), then the image is built (no push), held to
  # its size budget and smoke-run with the hardened container settings the kit will use.
  documents:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # LibreOffice behind Gotenberg: a generated deck must convert (the render check below)
    services:
      gotenberg:
        image: gotenberg/gotenberg:8.38.1
        ports:
          - 3000:3000
    defaults:
      run:
        working-directory: documents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: documents/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Render check (LibreOffice via Gotenberg)
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
          GOTENBERG_URL=http://127.0.0.1:3000 uv run pytest -q tests/test_pptx_layout.py -k converts
      - name: Build the image (no push)
        run: docker build -t cerea-documents:ci .
      - name: Image stays under 300 MB
        run: |
          size="$(docker image inspect cerea-documents:ci --format '{{.Size}}')"
          echo "image size: $size bytes"
          test "$size" -lt 314572800
      - name: Smoke-run the hardened image
        run: |
          docker run -d --name docs --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1 \
            -e CEREA_DOCUMENTS_SECRET=ci-secret -p 8090:8090 cerea-documents:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/v1/capabilities)" = 401
          curl -fsS -H 'X-Cerea-Documents-Secret: ci-secret' http://127.0.0.1:8090/v1/capabilities | grep -q '"docx"'
          # a real document through the worker subprocess in the locked-down container
          uv run python -c "import docx; docx.Document().save('/tmp/ci.docx')"
          curl -fsS -H 'X-Cerea-Documents-Secret: ci-secret' -F file=@/tmp/ci.docx http://127.0.0.1:8090/v1/outline | grep -q '"format":"docx"'
          # creation in the locked-down container: a native chart (python-pptx part) and an image chart (matplotlib)
          cat > /tmp/create.json <<'JSON'
          {"format":"docx","spec":{"blocks":[{"type":"heading","level":1,"text":"CI"},{"type":"chart","chart_type":"column","categories":["a","b"],"series":[{"name":"s","values":[1,2]}]},{"type":"chart","chart_type":"pie","render":"image","categories":["a","b"],"series":[{"name":"s","values":[1,2]}]}]}}
          JSON
          curl -fsS -H 'X-Cerea-Documents-Secret: ci-secret' -H 'Accept: application/json' -F 'body=</tmp/create.json' http://127.0.0.1:8090/v1/create | grep -q '"reopened_with":"python-docx"'
      - name: Container logs on failure
        if: failure()
        run: docker logs docs || true

  # Whether the client project should run: always, except on a PR that leaves
  # src/lib/components and the route components (src/routes/**/*.svelte and their tests) alone (a component change is what the project tests).
  changes:
    if: github.event.schedule != '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.diff.outputs.client }}
      documents: ${{ steps.diff.outputs.documents }}
      browser: ${{ steps.diff.outputs.browser }}
      sandbox: ${{ steps.diff.outputs.sandbox }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            echo "documents=true" >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          if grep -qE '^src/(lib/components/|routes/.*\.svelte$)|\.svelte\.(test|spec)\.(js|ts)$' <<<"$changed"; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi
          # the whole e2e suite: a PR that touches what it runs against (the app,
          # its messages, the specs and harness, galopin, the Playwright config,
          # the dependencies, the kit's compose/config the stack reads, or this
          # workflow). Docs-only and changelog-only PRs keep just the smoke run.
          if grep -qE '^(src/|messages/|tests/|agent/|static/|playwright\.config\.ts$|package(-lock)?\.json$|svelte\.config\.js$|vite\.config\.ts$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
          # the document service: only when it (or this workflow, or the skill copy of its PDF form code) changed
          if grep -qE '^(documents/|\.github/workflows/ci\.yml$|scripts/sync_pdf_tools\.py$|src/lib/server/skills/builtin/pdf-tools/)' <<<"$changed"; then
            echo "documents=true" >> "$GITHUB_OUTPUT"
          else
            echo "documents=false" >> "$GITHUB_OUTPUT"
          fi
          # the sandbox manager and socket proxy (ADR 0115): their sources, or this workflow
          if grep -qE '^(sandbox/|src/lib/server/(sandbox|codeExecution)/|src/lib/utils/execution/figures\.ts$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=false" >> "$GITHUB_OUTPUT"
          fi
          # the browser runtime (ADR 0116): its sources, the bundle galopin embeds, or this workflow
          if grep -qE '^(browser-runtime/|agent/internal/browserrt/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  # The sandbox manager and its Docker socket proxy (ADR 0115), sandbox/: format, strict types, the
  # unit tests, then the integration tests against a real Docker daemon with the real gVisor
  # runtime (runsc, installed here: a hosted runner may restart Docker). The image builds too.
  sandbox:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: |
            sandbox/package-lock.json
            package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: The exec daemon's Python tests
        run: python3 -m unittest discover -s exec-image/tests -v
      - name: Install gVisor (runsc) and register it with Docker
        working-directory: .
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
          docker run --rm --runtime=runsc hello-world
      - name: Integration tests with the real runsc runtime
        run: SANDBOX_RUNTIME=runsc npm run test:integration
      - name: The image builds
        working-directory: .
        run: docker build -t cerea-sandbox:ci sandbox/
      - name: Build the Python exec image
        working-directory: .
        run: docker build -t cerea-sandbox-python:ci sandbox/exec-image/
      - name: The exec image in a gVisor sandbox (numpy, a plot, files, state, no network)
        run: SANDBOX_INTEGRATION=1 SANDBOX_EXEC_IMAGE=cerea-sandbox-python:ci SANDBOX_RUNTIME=runsc node --test --test-concurrency=1 --test-timeout=240000 test/execimage.integration.test.ts
      - name: execute_code through the chat's client, a real manager and the exec image
        working-directory: .
        env:
          SANDBOX_INTEGRATION_TOKEN: ci-integration-token-0123456789
        run: |
          npm ci
          cd sandbox
          SANDBOX_INSTANCE=ci SANDBOX_RUNTIME=runsc SANDBOX_ALLOWED_IMAGES=cerea-sandbox-python:ci \
            SANDBOX_PROXY_PORT=2375 node src/socket-proxy/main.ts > "$RUNNER_TEMP/proxy.log" 2>&1 &
          SANDBOX_MANAGER_TOKEN="$SANDBOX_INTEGRATION_TOKEN" SANDBOX_INSTANCE=ci SANDBOX_RUNTIME=runsc \
            SANDBOX_EXEC_IMAGE=cerea-sandbox-python:ci SANDBOX_DOCKER_URL=http://127.0.0.1:2375 \
            SANDBOX_MANAGER_HOST=127.0.0.1 SANDBOX_MANAGER_PORT=8080 SANDBOX_AUDIT_LOG= \
            SANDBOX_EXEC_MEMORY_MB=1024 node src/manager/main.ts > "$RUNNER_TEMP/manager.log" 2>&1 &
          cd ..
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v1/health && break; sleep 1; done
          SANDBOX_INTEGRATION_URL=http://127.0.0.1:8080 npx vitest run --project=server src/lib/server/codeExecution/sandboxSessions.integration.spec.ts || { tail -40 "$RUNNER_TEMP/manager.log"; exit 1; }

  # The browser runtime (ADR 0116), browser-runtime/: format, strict types, its tests against local
  # fixture pages in a real Chromium, and a check that the bundle galopin embeds is the one the
  # sources make. Nothing here touches an external site.
  browser-runtime:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: browser-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: browser-runtime/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx playwright-core install --with-deps chromium
      # Hosted runners restrict user namespaces, so Chromium's sandbox is off for the fixtures.
      - run: npm test
        env:
          CEREA_TEST_NO_SANDBOX: "1"
      - name: The embedded bundle is current
        run: |
          npm run bundle
          git diff --exit-code -- ../agent/internal/browserrt

  client:
    name: client (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Sharded: one browser page running every client file piled up enough
    # Playwright route objects to hit "route.fulfill: The object has been
    # collected to prevent unbounded heap growth" once the suite grew (#204).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The Playwright image's browsers must match the *installed* Playwright
    # exactly, or the project silently reports "no tests" (see AGENTS.md).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user root
    env:
      HOME: /root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx vitest run --project=client --shard=${{ matrix.shard }}/3

  # The end-to-end smoke subset: the specs tagged @smoke (sign-in-free landing,
  # a chat turn against the mock upstream, sidebar and projects, workspace
  # tabs, settings, the /code panel's basics, file cards). Builds once, then
  # the harness (playwright.config.ts) starts its own Mongo, mock upstream,
  # mock IdP and the app from that build: no service container needed.
  e2e-smoke:
    if: github.event.schedule == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user root
    # RustFS for the blob-store spec's second run (the files on S3). Reached by
    # its service name, since this job runs in a container.
    services:
      rustfs:
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key-0123456789
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HOME: /root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      # mongodb-memory-server's mongod links libcurl.
      - run: apt-get update -qq && (apt-get install -y -qq libcurl4t64 || apt-get install -y -qq libcurl4)
      # The checkout is owned by another uid than root: without this git (and so go build's VCS
      # stamping of galopin) refuses it as a "dubious ownership" repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: /root/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npx playwright test --project=chromium --grep @smoke
        env:
          E2E_SKIP_BUILD: "1"
      # The same upload, download and delete flow with the files in a bucket.
      - name: Blob store on S3 (RustFS)
        run: npx playwright test --project=chromium --grep @blob-store
        env:
          E2E_SKIP_BUILD: "1"
          CHAT_BLOB_STORE: s3
          CHAT_S3_ENDPOINT: http://rustfs:9000
          CHAT_S3_BUCKET: cerea-e2e
          CHAT_S3_ACCESS_KEY_ID: ci-access-key
          CHAT_S3_SECRET_ACCESS_KEY: ci-secret-key-0123456789
          CHAT_S3_CREATE_BUCKET: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The whole end-to-end suite, chromium: nightly, on demand with `-f full=true`,
  # and on a PR that touches what it runs against. Four shards on four runners
  # (Playwright splits the spec files; workers stay 1 inside a shard, the db
  # fixture wipes between tests). The real-machine specs run a real galopin
  # (built from agent/) over a real opencode, so each shard carries Go and
  # opencode too.
  e2e-shard:
    needs: changes
    if: >-
      always() && !cancelled() && (
        github.event.schedule == '17 3 * * *' ||
        (github.event_name == 'workflow_dispatch' && inputs.full) ||
        (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true'))
    name: e2e-full shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user root
    services:
      rustfs:
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key-0123456789
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HOME: /root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: apt-get update -qq && (apt-get install -y -qq libcurl4t64 || apt-get install -y -qq libcurl4)
      # The checkout is owned by another uid than root: without this git (and so go build's VCS
      # stamping of galopin) refuses it as a "dubious ownership" repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: /root/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - name: Install the pinned opencode
        run: |
          want=$(cat agent/packaging/opencode-version)
          npm install -g "opencode-ai@${want}"
          [ "$(opencode --version)" = "$want" ] || { echo "::error::wrong opencode"; exit 1; }
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4 --reporter=list,blob
        env:
          E2E_SKIP_BUILD: "1"
      # The S3 run is the same specs against a bucket: once, on shard 1, not four times.
      - name: Blob store on S3 (RustFS)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: npx playwright test --project=chromium --grep @blob-store --reporter=list
        env:
          E2E_SKIP_BUILD: "1"
          CHAT_BLOB_STORE: s3
          CHAT_S3_ENDPOINT: http://rustfs:9000
          CHAT_S3_BUCKET: cerea-e2e
          CHAT_S3_ACCESS_KEY_ID: ci-access-key
          CHAT_S3_SECRET_ACCESS_KEY: ci-secret-key-0123456789
          CHAT_S3_CREATE_BUCKET: "true"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-full-failures-${{ matrix.shard }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  # The one "e2e-full" result: merges the shards' blob reports into a single
  # HTML report and fails when any shard failed or did not run to the end. A
  # run where the suite was not wanted (a docs PR) skips this job, as it
  # skipped the old single e2e-full job.
  e2e-full:
    needs: e2e-shard
    if: always() && needs.e2e-shard.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shards' reports
        run: |
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            npx playwright merge-reports --reporter=html ./all-blob-reports || true
            npx playwright merge-reports --reporter=list ./all-blob-reports > summary.txt || true
            {
              echo '## e2e-full (4 shards)'
              echo '```'
              grep -vE '^\s+(ok|✓)' summary.txt | tail -n 80 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No blob reports were uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-full-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard result: $RESULT"
          [ "$RESULT" = success ]
