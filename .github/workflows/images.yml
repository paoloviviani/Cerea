# Publish the Cerea images (the chat and the document service, same tags) —
# from main and release tags only (GitHub free plan:
# PRs never build it; this is the most expensive build either repository has,
# about 15 minutes with the pyodide sync, so it runs only when the chat's
# inputs changed).
#
# The package is public: anyone can pull it with no login.
# The galopin image (agent/Dockerfile: galopin, the pinned opencode and a
# development toolbox, for a disposable agent container) is versioned with the
# chat too, so one release tag gives all three.
# Tags: main → edge; vX.Y.Z → X.Y.Z, X.Y (never overwritten). Pystino pins the
# image by digest (ADR 0087), so no per-commit tag exists. Built with
# APP_BASE=/chat (compile-time in SvelteKit). No attestations: pruning their
# untagged manifests would break the image.
name: images

# Run by hand on a release tag (`gh workflow run images.yml --ref vX.Y.Z`),
# after CI is green on that commit; see CONTRIBUTING.md "Releasing". It does
# not run on every push to main, so nothing is published by accident.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cerea:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/cerea:${GITHUB_REF_NAME#v}" >/dev/null 2>&1; then
            echo "::error::cerea:${GITHUB_REF_NAME#v} already exists; a release tag is immutable"; exit 1
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerea
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=cerea
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_BASE=/chat
            PUBLIC_COMMIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=cerea
          cache-to: type=gha,mode=max,scope=cerea
          provenance: false
          sbom: false
      - name: Record the digest (what Pystino's release.env pins)
        run: echo "CEREA_IMAGE=ghcr.io/${{ github.repository_owner }}/cerea@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      # A step, not a second job: every job is billed rounded up to a minute.
      - uses: actions/delete-package-versions@v5
        with:
          {
            package-name: cerea,
            package-type: container,
            delete-only-untagged-versions: "true",
            min-versions-to-keep: 5,
          }

  # The document service (ADR 0103, documents/): versioned with the chat, so a
  # release tag gives both `cerea:X.Y.Z` and `cerea-documents:X.Y.Z`, and the
  # kit's single CEREA_VERSION pin names both. A small build (a minute or two).
  cerea-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/cerea-documents:${GITHUB_REF_NAME#v}" >/dev/null 2>&1; then
            echo "::error::cerea-documents:${GITHUB_REF_NAME#v} already exists; a release tag is immutable"; exit 1
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerea-documents
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=cerea-documents
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: documents
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=cerea-documents
          cache-to: type=gha,mode=max,scope=cerea-documents
          provenance: false
          sbom: false
      - name: Record the digest
        run: echo "CEREA_DOCUMENTS_IMAGE=ghcr.io/${{ github.repository_owner }}/cerea-documents@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/delete-package-versions@v5
        with:
          {
            package-name: cerea-documents,
            package-type: container,
            delete-only-untagged-versions: "true",
            min-versions-to-keep: 5,
          }

  # The sandbox manager and its Docker socket proxy (ADR 0115, sandbox/): versioned with the
  # chat like the document service, so a release tag gives `cerea-sandbox:X.Y.Z` too. A tiny build.
  cerea-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/cerea-sandbox:${GITHUB_REF_NAME#v}" >/dev/null 2>&1; then
            echo "::error::cerea-sandbox:${GITHUB_REF_NAME#v} already exists; a release tag is immutable"; exit 1
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerea-sandbox
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=cerea-sandbox
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=cerea-sandbox
          cache-to: type=gha,mode=max,scope=cerea-sandbox
          provenance: false
          sbom: false
      - name: Record the digest
        run: echo "CEREA_SANDBOX_IMAGE=ghcr.io/${{ github.repository_owner }}/cerea-sandbox@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/delete-package-versions@v5
        with:
          {
            package-name: cerea-sandbox,
            package-type: container,
            delete-only-untagged-versions: "true",
            min-versions-to-keep: 5,
          }

  # The Python image `execute_code` runs in on the server (ADR 0115, sandbox/exec-image/): a pinned
  # scientific and office stack and the exec daemon. Versioned with the chat like the others.
  cerea-sandbox-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/cerea-sandbox-python:${GITHUB_REF_NAME#v}" >/dev/null 2>&1; then
            echo "::error::cerea-sandbox-python:${GITHUB_REF_NAME#v} already exists; a release tag is immutable"; exit 1
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerea-sandbox-python
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=cerea-sandbox-python
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: sandbox/exec-image
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=cerea-sandbox-python
          cache-to: type=gha,mode=max,scope=cerea-sandbox-python
          provenance: false
          sbom: false
      - name: Record the digest
        run: echo "CEREA_SANDBOX_PYTHON_IMAGE=ghcr.io/${{ github.repository_owner }}/cerea-sandbox-python@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/delete-package-versions@v5
        with:
          {
            package-name: cerea-sandbox-python,
            package-type: container,
            delete-only-untagged-versions: "true",
            min-versions-to-keep: 5,
          }

  # galopin + opencode + a development toolbox (agent/Dockerfile): a disposable
  # container a person pairs with the Agents panel. Versioned with the chat, so
  # `galopin:X.Y.Z` goes with `cerea:X.Y.Z`. linux/amd64 only for now.
  galopin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/galopin:${GITHUB_REF_NAME#v}" >/dev/null 2>&1; then
            echo "::error::galopin:${GITHUB_REF_NAME#v} already exists; a release tag is immutable"; exit 1
          fi
      # galopin reports the Cerea release it is built from (`galopin version`).
      - id: ver
        run: echo "v=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/galopin
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=galopin
            org.opencontainers.image.description=galopin and opencode with python, node, a C toolchain, git and gh, for a disposable coding-agent container
            org.opencontainers.image.licenses=Apache-2.0
      # Built and run once before anything is pushed: a broken image never
      # reaches a tag. The push below reuses these layers.
      - name: Build, then check the tools are there
        uses: docker/build-push-action@v6
        with:
          context: agent
          build-args: GALOPIN_VERSION=${{ steps.ver.outputs.v }}
          load: true
          tags: galopin:smoke
          cache-from: type=gha,scope=galopin
          cache-to: type=gha,mode=max,scope=galopin
          provenance: false
          sbom: false
      - name: Smoke test
        run: |
          want=$(cat agent/packaging/opencode-version)
          docker run --rm -e WANT="$want" -e WANT_GALOPIN="${{ steps.ver.outputs.v }}" galopin:smoke bash -ec '
            galopin help >/dev/null
            [ "$(galopin version)" = "$WANT_GALOPIN" ]
            [ "$(opencode --version)" = "$WANT" ]
            node -v; python3 --version; gcc --version | head -1; git --version; gh --version | head -1
            pnpm -v; uv --version; rg --version | head -1; jq --version
            [ "$(id -u)" = 1000 ]'
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: agent
          build-args: GALOPIN_VERSION=${{ steps.ver.outputs.v }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=galopin
          cache-to: type=gha,mode=max,scope=galopin
          provenance: false
          sbom: false
      - name: Record the digest
        run: echo "GALOPIN_IMAGE=ghcr.io/${{ github.repository_owner }}/galopin@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/delete-package-versions@v5
        with:
          {
            package-name: galopin,
            package-type: container,
            delete-only-untagged-versions: "true",
            min-versions-to-keep: 5,
          }
