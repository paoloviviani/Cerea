# Cerea: the full stack in one file — the chat (Cerea), the gateway and console
# (Pystino), the bundled IdP (Authelia), the proxy (Caddy) and the add-ons.
#
#   ./configure              writes .env (or: cp .env.example .env and edit it)
#   docker compose up -d     brings everything up; add --wait to block until healthy
#
# Every service names an image; nothing here builds. The images this release
# was tested with are the defaults below, so an install never names a version:
# upgrading is `sh get-kit.sh --upgrade`, then `docker compose pull && docker compose up -d`.
# dev/build.sh builds the same images from source and points .env at them.
#
# Add-ons are compose profiles chosen by COMPOSE_PROFILES in .env: gateway,
# chat, authelia, redaction, documents, fetch. Profiles select services; they never change
# what a service is.
#
# Caddy and Authelia run their stock images. Their configuration is the
# readable files in caddy/ and authelia/, mounted read-only. Compose does not
# recreate a container when a mounted file changes, so each of those services
# carries a `cerea.config-rev` label: a digest of its directory, which
# tools/pin rewrites whenever the files change. A release that changes the
# Caddyfile therefore changes this file too, and `up -d` recreates the proxy.
# Edited them locally? `docker compose up -d --force-recreate proxy authelia`.

name: ${COMPOSE_PROJECT_NAME:-cerea}

# The pins. tools/pin rewrites the defaults after `:-` on each release; .env
# overrides them only for local builds (dev/build.sh) or a private registry.
x-gateway-image: &gateway-image ${GATEWAY_IMAGE:-${PYSTINO_REGISTRY:-ghcr.io/paoloviviani}/pystino-gateway:${PYSTINO_VERSION:-0.3.2}}
x-redaction-image: &redaction-image ${REDACTION_IMAGE:-${PYSTINO_REGISTRY:-ghcr.io/paoloviviani}/pystino-redaction:${PYSTINO_VERSION:-0.3.2}-pattern}
x-cerea-image: &cerea-image ${CEREA_IMAGE:-${CEREA_REGISTRY:-ghcr.io/paoloviviani}/cerea:${CEREA_VERSION:-0.7.2}}

x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gateway}

services:
  # --- always on -------------------------------------------------------------

  postgres:
    # pgvector: knowledge-base retrieval is a SQL query. The chat's
    # own database lives on the same instance; `bootstrap` creates it.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      # One level above data/: PostgreSQL 18's image refuses the old mount point.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Idempotent, on every `up`: validates .env, creates or re-asserts the chat's
  # database role, and seeds Authelia's key and first user when absent. It never
  # overwrites state, so re-running it is always safe — which is what replaced
  # the installer's phase 2 and its resume memory.
  bootstrap:
    image: *gateway-image
    command: ["pystino", "bootstrap"]
    restart: "no"
    # Root, for one reason: it writes Authelia's key and users file into a
    # volume Authelia (root in its image) reads. It runs, exits, and holds no
    # port.
    user: "0:0"
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      CHAT_PG_PASSWORD: ${CHAT_PG_PASSWORD:-}
      AUTHELIA_ADMIN_USER: ${AUTHELIA_ADMIN_USER:-}
      AUTHELIA_ADMIN_EMAIL: ${AUTHELIA_ADMIN_EMAIL:-}
      AUTHELIA_ADMIN_NAME: ${AUTHELIA_ADMIN_NAME:-}
      AUTHELIA_ADMIN_PASSWORD_DIGEST: ${AUTHELIA_ADMIN_PASSWORD_DIGEST:-}
      # Written to a file under the authelia-config volume, at 0600 -- never
      # this environment's own value, so it never appears in
      # `docker compose config` or this container's own inspectable env.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - authelia-config:/authelia
      - authelia-data:/authelia-data
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    # Stock Caddy reading caddy/Caddyfile. TLS_MODE picks acme, internal or
    # upstream (TLS terminated in front, e.g. the NetBird edge) through the
    # variables below; the routes are the same in all three.
    image: ${CADDY_IMAGE:-caddy:2.11-alpine}
    restart: unless-stopped
    labels:
      cerea.config-rev: "sha256:19f552f754158415"
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (./configure writes it)}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
      DEFAULT_SNI_DIRECTIVE: ${DEFAULT_SNI_DIRECTIVE:-}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.org}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      PROXY_DEFAULT: ${PROXY_DEFAULT:-gateway}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Directories, never single files: a directory mount sees new and
      # renamed files, so neither an upgrade nor a component adding a route
      # meets the stale inode a single-file mount pins.
      - ./caddy:/etc/caddy:ro
      # Operator and component snippets (*.caddy), imported inside the site
      # block. Git ignores them, so an upgrade never conflicts with yours.
      - ./proxy.d:/etc/caddy.d:ro
    depends_on:
      gateway:
        condition: service_started
        required: false
      chat:
        condition: service_started
        required: false
      authelia:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- profile: gateway ------------------------------------------------------

  valkey:
    profiles: [gateway]
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    profiles: [gateway]
    image: *gateway-image
    command: ["alembic", "-c", "apps/gateway/alembic.ini", "upgrade", "head"]
    restart: "no"
    environment:
      GATEWAY_DATABASE_URL: *database-url
      GATEWAY_UPSTREAM__BASE_URL: ${GATEWAY_UPSTREAM__BASE_URL:-https://api.cortecs.ai/v1}
      GATEWAY_UPSTREAM__API_KEY: ${GATEWAY_UPSTREAM__API_KEY:-}
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY:?set GATEWAY_SECRET_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    profiles: [gateway]
    image: *gateway-image
    restart: unless-stopped
    ports:
      # Loopback only, for SSH port-forwarding and local scripts; the world
      # reaches the gateway through the proxy.
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-production}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      GATEWAY_LOG_JSON: ${GATEWAY_LOG_JSON:-true}
      GATEWAY_DATABASE_URL: *database-url
      GATEWAY_VALKEY_URL: redis://valkey:6379/0
      GATEWAY_BILLING_CURRENCY: ${GATEWAY_BILLING_CURRENCY:-EUR}
      GATEWAY_SESSION_SECRET: ${GATEWAY_SESSION_SECRET:?set GATEWAY_SESSION_SECRET in .env}
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY}
      GATEWAY_SESSION_COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1"
      GATEWAY_UPSTREAM__BASE_URL: ${GATEWAY_UPSTREAM__BASE_URL:-https://api.cortecs.ai/v1}
      GATEWAY_UPSTREAM__API_KEY: ${GATEWAY_UPSTREAM__API_KEY:-}
      GATEWAY_ACCOUNTING__ENABLED: ${GATEWAY_ACCOUNTING__ENABLED:-true}
      GATEWAY_QUOTA__ENABLED: ${GATEWAY_QUOTA__ENABLED:-true}
      # Redaction: the engine is `noop` unless the redaction profile is on
      # (./configure writes both together). The endpoints are harmless when
      # nothing listens there, because the noop engine never calls them.
      GATEWAY_REDACTION__ENGINE: ${GATEWAY_REDACTION__ENGINE:-noop}
      GATEWAY_REDACTION__ENDPOINT: http://redaction:8080
      GATEWAY_REDACTION__PLACEHOLDER_KEY: ${REDACTION_PLACEHOLDER_KEY:-}
      GATEWAY_REDACTION__LANGUAGE: ${REDACTION_LANGUAGE:-en}
      GATEWAY_REDACTION__FAIL_OPEN: "false"
      GATEWAY_EXTRACTOR__ENDPOINT: ${GATEWAY_EXTRACTOR__ENDPOINT:-}
      GATEWAY_TRANSCRIPT_RETENTION_HOURS: ${GATEWAY_TRANSCRIPT_RETENTION_HOURS:-24}
      # Identity: OIDC only. The env seeds the first provider row;
      # after that the console owns it. INTERNAL_BASE_URL is the back-channel:
      # the gateway reaches the bundled Authelia at http://authelia:9091, never
      # through the proxy, so no CA bundle is ever needed.
      GATEWAY_LOCAL_AUTH__ENABLED: ${GATEWAY_LOCAL_AUTH__ENABLED:-false}
      GATEWAY_OIDC__ENABLED: ${OIDC_ENABLED:-true}
      GATEWAY_OIDC__ISSUER: ${OIDC_ISSUER:-}
      GATEWAY_OIDC__INTERNAL_BASE_URL: ${OIDC_INTERNAL_BASE_URL:-}
      GATEWAY_OIDC__CLIENT_ID: ${OIDC_CONSOLE_CLIENT_ID:-pystino-console}
      GATEWAY_OIDC__CLIENT_SECRET: ${OIDC_CONSOLE_CLIENT_SECRET:-}
      GATEWAY_OIDC__REDIRECT_URI: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}/auth/callback/default
      # A JSON list (pydantic-settings); ./configure writes it from OIDC_SCOPES.
      GATEWAY_OIDC__SCOPES: ${OIDC_SCOPES_JSON:-["openid","profile","email","groups"]}
      GATEWAY_OIDC__GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      GATEWAY_OIDC__ACCESS_TOKEN_AUDIENCE: ${OIDC_AUDIENCE:-pystino-api}
      GATEWAY_OIDC__LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-false}
      # `authelia` for the bundled IdP (./configure writes it): the seeded provider
      # row then gets the users-file sync and the console's user management.
      GATEWAY_OIDC__KIND: ${OIDC_KIND:-generic}
      # How far the directory's answer about groups reaches; forced to never
      # with the bundled Authelia regardless of what is set here, since its
      # users file carries no groups claim worth polling.
      GATEWAY_OIDC__GROUP_SYNC: ${OIDC_GROUP_SYNC:-every_login}
      # What a group name from the IdP that no group carries yet does at a
      # sign-in: manual lists it in the console (Groups, "Seen from your
      # identity provider") to import or dismiss; auto creates it. Groups that
      # exist are granted either way. No effect with the bundled Authelia,
      # whose groups are the console's.
      GATEWAY_OIDC__GROUP_IMPORT: ${OIDC_GROUP_IMPORT:-manual}
      # Advanced: only these IdP group names are considered at all (comma-
      # separated, or a JSON list); `[]` considers every one.
      GATEWAY_OIDC__GROUP_ALLOWLIST: ${OIDC_GROUP_ALLOWLIST:-[]}
      # The group every person joins at their first sign-in, with any IdP, so a
      # new account has a group to bill; it grants no model by itself. `-`,
      # not `:-`: set empty in .env, it is off.
      GATEWAY_OIDC__DEFAULT_GROUP: ${OIDC_DEFAULT_GROUP-users}
      # Overrides the provider's own end_session_endpoint; the chat reads the
      # same value below (OPENID_LOGOUT_URL), so one sign-out ends both.
      GATEWAY_OIDC__LOGOUT_URL: ${OIDC_LOGOUT_URL:-}
      # Who is an administrator, from the environment rather than a console
      # row. Set one pair — a comma-separated list of verified addresses, or
      # a claim path plus the comma-separated values that confer it — or
      # neither with the bundled Authelia, which uses
      # PYSTINO_BOOTSTRAP_ADMIN_EMAIL below instead.
      GATEWAY_OIDC__ADMIN_EMAILS: ${OIDC_ADMIN_EMAIL:-}
      GATEWAY_OIDC__ADMIN_CLAIM: ${OIDC_ADMIN_CLAIM:-}
      GATEWAY_OIDC__ADMIN_CLAIM_VALUES: ${OIDC_ADMIN_CLAIM_VALUE:-}
      # A bearer token's azp (or client_id) must name one of these once an
      # audience is set: the console, the chat, and galopin's machine client.
      GATEWAY_OIDC__ACCEPTED_CLIENTS: ${OIDC_ACCEPTED_CLIENTS:-${OIDC_CONSOLE_CLIENT_ID:-pystino-console},${OIDC_CHAT_CLIENT_ID:-cerea},${OIDC_MACHINE_CLIENT_ID:-opencode-enrollment}}
      # Which of those accepted clients is the chat, specifically: its own
      # sign-in door (POST /v1/session/announce) refuses a token whose azp
      # names the console or the machine client, not just any accepted one.
      GATEWAY_OIDC__CHAT_CLIENT_ID: ${OIDC_CHAT_CLIENT_ID:-cerea}
      # The chat client's secret, the same value the chat gets as
      # OPENID_CLIENT_SECRET: an IdP whose access tokens are opaque (GitLab)
      # is asked about them at its introspection endpoint, authenticated as
      # that client.
      GATEWAY_OIDC__CHAT_CLIENT_SECRET: ${OIDC_CHAT_CLIENT_SECRET:-}
      # One sign-out for both applications on this origin: signing out of the
      # console also expires the chat's session cookie (and the chat does the
      # same for the console's, below).
      GATEWAY_LOGOUT_ALSO_CLEAR_COOKIES: '["hf-chat"]'
      GATEWAY_BOOTSTRAP_ADMIN_EMAIL: ${PYSTINO_BOOTSTRAP_ADMIN_EMAIL:-}
      # The stack's one mail setting: quota notices and the console's "send
      # test". SMTP_ENABLED stays false until SMTP_HOST etc. are filled in.
      GATEWAY_SMTP__ENABLED: ${SMTP_ENABLED:-false}
      GATEWAY_SMTP__HOST: ${SMTP_HOST:-}
      GATEWAY_SMTP__PORT: ${SMTP_PORT:-587}
      GATEWAY_SMTP__USERNAME: ${SMTP_USERNAME:-}
      GATEWAY_SMTP__PASSWORD: ${SMTP_PASSWORD:-}
      GATEWAY_SMTP__FROM_ADDRESS: ${SMTP_FROM:-}
      GATEWAY_SMTP__SECURITY: ${SMTP_SECURITY:-starttls}
      # The chat's own erasure endpoint, over the compose network only --
      # every preset that runs the gateway also runs the chat, so this is
      # a fixed address, not an operator setting. Empty
      # CHAT_ERASURE_TOKEN (an .env from before ./configure minted one)
      # means delete refuses at request time with "this deployment's chat
      # is not reachable from the gateway", not a startup failure.
      GATEWAY_CHAT__ERASURE_URL: http://chat:3000/chat/internal/erasure
      GATEWAY_CHAT__ERASURE_TOKEN: ${CHAT_ERASURE_TOKEN:-}
    volumes:
      # The bundled Authelia's users file, which the console manages
      # and the authelia_file adapter reads. Empty when the profile is off.
      - authelia-config:/authelia
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      authelia:
        condition: service_healthy
        required: false
      redaction:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- profile: authelia (the bundled IdP) ------------------------------------

  authelia:
    profiles: [authelia]
    # Stock Authelia reading authelia/configuration.yml. Every secret arrives
    # through the environment and the signing key through a file bootstrap
    # creates once, via Authelia's template filter. A new client arrives with
    # the file and the label below; a changed secret changes this service's
    # environment. Either way compose recreates it, and nothing is rendered on
    # the host, so nothing drifts.
    image: ${AUTHELIA_IMAGE:-authelia/authelia:4.39.22}
    command: ["--config", "/etc/authelia/configuration.yml"]
    restart: unless-stopped
    labels:
      cerea.config-rev: "sha256:7e65be1f5d7fb4da"
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      # The gateway's uid: the console manages the bundled users file,
      # and Authelia's entrypoint re-owns /config to PUID on every start —
      # as root it would lock the gateway out of the file after a restart.
      PUID: "1001"
      PGID: "1001"
      X_AUTHELIA_HEALTHCHECK_PATH: /authelia
      X_PYSTINO_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      X_PYSTINO_COOKIE_DOMAIN: ${AUTHELIA_COOKIE_DOMAIN:-}
      X_PYSTINO_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:-}
      X_PYSTINO_HMAC_SECRET: ${AUTHELIA_HMAC_SECRET:-}
      X_PYSTINO_STORAGE_KEY: ${AUTHELIA_STORAGE_KEY:-}
      # Signs the reset-password link's token, needed once self-service
      # reset is on; minted regardless, like the three secrets above, so
      # turning SMTP on later needs nothing new.
      X_PYSTINO_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_RESET_PASSWORD_JWT_SECRET:-}
      X_PYSTINO_CONSOLE_CLIENT_DIGEST: ${AUTHELIA_CONSOLE_CLIENT_DIGEST:-}
      X_PYSTINO_CHAT_CLIENT_DIGEST: ${AUTHELIA_CHAT_CLIENT_DIGEST:-}
      # Empty SMTP_HOST is how configuration.yml's own template picks the
      # filesystem notifier and a disabled password_reset -- the same one
      # setting the gateway's mail reads, never a second copy to disagree
      # with it. The SMTP password itself never travels through this
      # environment: configuration.yml's `secret` call reads the file
      # bootstrap writes directly from the authelia-config volume, mounted
      # below at /config, the same one the JWKS key already uses.
      X_PYSTINO_SMTP_HOST: ${SMTP_HOST:-}
      X_PYSTINO_SMTP_PORT: ${SMTP_PORT:-587}
      X_PYSTINO_SMTP_USERNAME: ${SMTP_USERNAME:-}
      X_PYSTINO_SMTP_FROM: ${SMTP_FROM:-}
      X_PYSTINO_SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # SMTP_PASSWORD is optional even with SMTP_HOST set (an unauthenticated
      # relay on a private network): empty is how configuration.yml's
      # template knows to skip the `password` line entirely rather than
      # reading a file bootstrap never wrote.
      X_PYSTINO_SMTP_HAS_PASSWORD: ${SMTP_PASSWORD:+true}
    volumes:
      - ./authelia:/etc/authelia:ro
      - authelia-config:/config
      - authelia-data:/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # --- profile: chat -----------------------------------------------------------

  chat-mongo:
    profiles: [chat]
    image: ${MONGO_IMAGE:-mongo:4.4}
    restart: unless-stopped
    volumes:
      - chat-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\").ok' || mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  chat:
    profiles: [chat]
    # Built with APP_BASE=/chat: SvelteKit's base path is compile-time, so a
    # published image serves /chat and nothing else.
    image: *cerea-image
    restart: unless-stopped
    # Plain environment, not a DOTENV_LOCAL block: the chat reads its settings
    # from the process environment, and a multi-line variable was what made
    # every compose call need the environment scrubbed first.
    environment:
      MONGODB_URL: mongodb://chat-mongo:27017
      MONGODB_DB_NAME: chat-ui
      OPENAI_BASE_URL: ${CHAT_OPENAI_BASE_URL:-http://gateway:8000/v1}
      OPENAI_API_KEY: ${CHAT_OPENAI_API_KEY:-}
      USE_USER_TOKEN: ${CHAT_USE_USER_TOKEN:-true}
      AUTOMATIC_LOGIN: "true"
      CHAT_PG_URL: postgresql://chat:${CHAT_PG_PASSWORD:-}@postgres:5432/chat
      FETCH_BACKEND: ${FETCH_BACKEND:-direct}
      # Set only while the fetch profile runs the renderer (./configure keeps
      # the two in step). Empty: the chat reports "not configured" instead of
      # probing a service that is not there.
      PLAYWRIGHT_WS_ENDPOINT: ${PLAYWRIGHT_WS_ENDPOINT:-}
      CHAT_CODE_TOOL_ENABLED: ${CHAT_CODE_TOOL_ENABLED-true}
      CHAT_USAGE_ENABLED: ${CHAT_USAGE_ENABLED-true}
      CHAT_CONSOLE_ENABLED: ${CHAT_CONSOLE_ENABLED-true}
      CHAT_KNOWLEDGE_ENABLED: ${CHAT_KNOWLEDGE_ENABLED-true}
      CHAT_MEMORY_ENABLED: ${CHAT_MEMORY_ENABLED-true}
      # The document reader for uploads and the knowledge base. Empty means
      # the chat resolves one on its own: this deployment's local extractor
      # or the first OCR-kind model on the gateway's catalogue. Set
      # CHAT_OCR_MODEL to pin a specific one, or set CHAT_OCR_BASE_URL to
      # bypass the gateway entirely and call an OCR endpoint directly
      # (CHAT_OCR_API_KEY beside it, if that endpoint needs a key).
      CHAT_OCR_MODEL: ${CHAT_OCR_MODEL:-}
      CHAT_OCR_BASE_URL: ${CHAT_OCR_BASE_URL:-}
      CHAT_OCR_API_KEY: ${CHAT_OCR_API_KEY:-}
      CHAT_PDF_IMAGE_PAGES: ${CHAT_PDF_IMAGE_PAGES:-20}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-}
      # The agent-machine component: galopin, the machine agent, dials
      # wss://<origin>/chat/api/v2/code/machine — the /chat route the proxy
      # already has, so no extra service, port or route — and authenticates
      # with its enrollment's OIDC access token (client opencode-enrollment,
      # audience pystino-api), validated locally against the same issuer as
      # the browser login, over the same back-channel. No relay.
      CODE_AGENTS_ENABLED: ${CODE_AGENTS_ENABLED-}
      # The browser terminal in /code: off unless exactly "true", and even then
      # only for machines enrolled with --allow-terminal.
      CODE_TERMINAL_ENABLED: ${CODE_TERMINAL_ENABLED:-}
      # Scheduled actions in /code: on with CODE_AGENTS_ENABLED unless exactly
      # "false" (the kill switch); at most this many schedules per person.
      CHAT_SCHEDULES_ENABLED: ${CHAT_SCHEDULES_ENABLED:-}
      CHAT_SCHEDULES_MAX_PER_USER: ${CHAT_SCHEDULES_MAX_PER_USER:-}
      # One issuer for all three clients: the machine link reads the same
      # OIDC_ISSUER, OIDC_AUDIENCE and OIDC_MACHINE_CLIENT_ID as the console
      # and the chat.
      CODE_MACHINE_ISSUER: ${OIDC_ISSUER:-}
      CODE_MACHINE_AUDIENCE: ${OIDC_AUDIENCE:-pystino-api}
      CODE_MACHINE_CLIENT_ID: ${OIDC_MACHINE_CLIENT_ID:-opencode-enrollment}
      OPENID_PROVIDER_URL: ${OIDC_ISSUER:-}
      # Same back-channel rule as the gateway: discovery, token and JWKS go
      # to the IdP on the compose network, never through the proxy.
      OPENID_INTERNAL_URL: ${OIDC_INTERNAL_BASE_URL:-}
      OPENID_CLIENT_ID: ${OIDC_CHAT_CLIENT_ID:-cerea}
      OPENID_CLIENT_SECRET: ${OIDC_CHAT_CLIENT_SECRET:-}
      OPENID_SCOPES: ${OIDC_SCOPES:-${OIDC_CHAT_SCOPES:-openid profile email groups}}
      # Signing out of the chat ends the IdP's session through this URL when
      # the IdP publishes no end_session_endpoint (the bundled Authelia);
      # `{redirect}` is where to land. And it expires the console's cookies on
      # this origin, so one sign-out covers both.
      OPENID_LOGOUT_URL: ${OIDC_LOGOUT_URL:-}
      LOGOUT_ALSO_CLEAR_COOKIES: gw_session,gw_idt:/auth
      CHAT_SECRET_KEY: ${CHAT_SECRET_KEY:-}
      # The gateway's own credential for /chat/internal/erasure, over the
      # compose network only. Never reachable from the edge regardless: the
      # Caddyfile answers 404 for this path first, and this app refuses any
      # request to /internal/* that carries a proxy header, whatever token
      # it presents.
      CHAT_ERASURE_TOKEN: ${CHAT_ERASURE_TOKEN:-}
      PUBLIC_APP_NAME: ${CHAT_APP_NAME:-Cerea}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      ORIGIN: ${PUBLIC_ORIGIN}/chat
      COOKIE_SAMESITE: lax
      ADDRESS_HEADER: X-Forwarded-For
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
      NODE_OPTIONS: --dns-result-order=ipv4first
    depends_on:
      chat-mongo:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
        required: false
      authelia:
        condition: service_healthy
        required: false

  # --- profile: redaction ------------------------------------------------------

  redaction:
    profiles: [redaction]
    image: *redaction-image
    restart: unless-stopped
    environment:
      REDACTION_NLP_ENGINE: ${REDACTION_NLP_ENGINE:-disabled}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # The local document reader (markitdown, antiword, page images). Its own
  # profile so a deployment without redaction still reads Office files; the
  # redaction profile brings it too.
  extractor:
    profiles: [documents, redaction]
    image: *redaction-image
    restart: unless-stopped
    environment:
      REDACTION_NLP_ENGINE: disabled
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- profile: fetch (headless browser for the chat's web fetch) -------------

  playwright:
    profiles: [fetch]
    image: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.61.1-noble}
    command: ["npx", "-y", "playwright@${PLAYWRIGHT_VERSION:-1.61.1}", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    user: pwuser
    init: true
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

# The names are the ones every existing install already has, so adopting an
# install under its old project name mounts the same data.
volumes:
  postgres-data:
  valkey-data:
  chat-mongo-data:
  authelia-config:
  authelia-data:
  caddy-data:
  caddy-config:
