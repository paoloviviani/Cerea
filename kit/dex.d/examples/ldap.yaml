# An LDAP or Active Directory server: people type their directory password on
# Dex's own login form. bindPW is a secret (dex.d/connectors.env).
- type: ldap
  id: corp-ldap
  name: Corporate directory
  config:
    host: ldap.example.org:636
    # startTLS: true        (host on port 389)
    # rootCA: /etc/dex.d/ldap-ca.pem   (a file beside this one)
    bindDN: cn=dex,ou=services,dc=example,dc=org
    bindPW: ${LDAP_BIND_PASSWORD}
    usernamePrompt: Username
    userSearch:
      baseDN: ou=people,dc=example,dc=org
      filter: "(objectClass=person)"
      username: uid
      idAttr: uid
      emailAttr: mail
      nameAttr: cn
    groupSearch:
      baseDN: ou=groups,dc=example,dc=org
      filter: "(objectClass=groupOfNames)"
      userMatchers:
        - userAttr: DN
          groupAttr: member
      nameAttr: cn
