<!doctype html>

<title>Page not found</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e5e5e5;
    --text: #0a0a0a;
    --muted: #454545;
    --accent: #1d4ed8;
    --solid: #2563eb;
    --solid-hover: #1d4ed8;
    --on-solid: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
  }
  main {
    width: 100%;
    max-width: 26rem;
    padding: 2rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
  }
  svg { width: 96px; height: 32px; color: var(--text); shape-rendering: crispEdges; }
  h1 { margin: 1.25rem 0 0.5rem; font-size: 1.8125rem; line-height: 1.25; font-weight: 700; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
  a { font-weight: 500; text-decoration: none; border-radius: 8px; padding: 0.625rem 1.25rem; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--solid); color: var(--on-solid); }
  .primary:hover { background: var(--solid-hover); }
  .secondary { color: var(--accent); border: 1px solid var(--border); }
  .secondary:hover { text-decoration: underline; }
</style>
</head>

</html>
